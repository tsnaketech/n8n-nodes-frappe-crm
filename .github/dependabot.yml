version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 casse la chaîne de lint : ts-api-utils, utilisé par
      # @typescript-eslint/typescript-estree que @n8n/node-cli embarque, lève
      # « Cannot read properties of undefined (reading 'Intrinsic') ». Rouvrir le
      # sujet quand @n8n/node-cli annonce le support de TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
